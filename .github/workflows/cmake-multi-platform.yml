name: Build & Test

on:
  push:
    branches: [ "master", "modernize" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC",     os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: "Linux Clang",   os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { name: "Windows MSVC",  os: windows-latest, cc: cl,    cxx: cl }
          - { name: "Windows MinGW", os: windows-latest, cc: gcc,   cxx: g++ }
          - { name: "macOS Clang",   os: macos-latest,   cc: clang, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: matrix.cxx == 'cl'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Linux Clang (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DALARM_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy (advisory)
    runs-on: ubuntu-latest
    # Advisory until the codebase has had a first clean pass; findings show in the log.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Build with clang-tidy
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DALARM_CLANG_TIDY=ON -DALARM_BUILD_TESTS=OFF
          cmake --build build
