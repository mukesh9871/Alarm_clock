name: Build

on:
  push:
    branches: [ "master", "modernize" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows-mingw:
    # alarm.cpp currently depends on Win32 + pthreads, so only MinGW on Windows can build it.
    # The portable rewrite (Phase 1) restores the Linux/macOS/MSVC matrix.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
